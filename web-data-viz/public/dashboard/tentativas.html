<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Tentativa | Game Winner</title>
</head>
<body>
    <div class="card-questionario">
    <h2>Registrar Momento Clutch</h2>
    
    <div class="campo">
        <span>O que aconteceu na jogada?</span>
        <input id="ipt_descricao" placeholder="Ex: Tentei um projeto ambicioso ">
    </div>

    <div class="campo">
        <span>Qual foi o desfecho?</span>
        <div class="botoes-resultado">
            <button class="btn-acerto" onclick="selecionar('Acertou')">ACERTEI</button>
            <button class="btn-erro" onclick="selecionar('Errou')">ERREI</button>
        </div>
    </div>

    <button onclick="registrarTentativa()" class="btn-enviar">Registrar Tentativa</button>
</div>
</body>
</html>
<script>
    var resultadoEscolhido = "";
    
    function selecionar(valor) {
        resultado_escolhido = valor;
    }
    
    function registrarTentativa() {
    let descricao_tentativa = ipt_descricao.value;

    fetch("/tentativas/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },

        body: JSON.stringify({

        descricao: descricao_tentativa,
        resultado: resultado_escolhido,
        id_usuario: sessionStorage.ID_USUARIO
    }),

    }).then(resposta => {
        if (resposta.ok) {
            alert("Tentativa registrada com sucesso!");
            window.location = "dashboard.html"; // Volta para ver o gráfico atualizado
        }
    });
}
</script>
