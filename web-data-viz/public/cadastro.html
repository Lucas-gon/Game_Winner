<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Game Winner - Cadastro</title>
</head>
<body class="body-autenticacao">
    <link rel="stylesheet" href="css/style.css">

    <div class="card-auth">
        <h2>Crie sua Conta</h2>
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="ipt_nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="ipt_email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="ipt_senha" placeholder="******">
        </div>
        <button class="btn-submit" onclick="cadastrar()">Cadastrar</button>
        <div id="mensagem_erro"></div>
        <div class="link-alt">
            Já tem conta? <a href="login.html">Faça login</a>
        </div>
    </div>
</body>
</html>
<script>
    function cadastrar() {
        let nome = ipt_nome.value;
        let email = ipt_email.value;
        let senha = ipt_senha.value;

        if (nome == '' || senha == '' || email == '') {
            console.log('Deu red')
        }

        // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nome,
        emailServer: email,
        senhaServer: senha,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          // cardErro.style.display = "block";
          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
          window.location = "./login.html";
            }, 2000);

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  
    }

</script>
