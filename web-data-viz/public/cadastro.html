<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Game Winner | Cadastro</title>
</head>
<link rel="icon" href="./assets/icon/game_winner.png">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<body class="body-autenticacao">

    <div class="header">
    <div class="container">
        <div class="header-logo">
            <h1 class="logo-titulo">Game Winner</h1>
        </div>
        <ul class="navbar">
            <li><a href="index.html">Início</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="cadastro.html" style="color: var(--detalhe);">Cadastro</a></li>
        </ul>
    </div>
</div>
    <div class="area-formulario">
        <div class="card-auth">
            <h2>🏀Crie sua Conta🏀</h2>
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="ipt_nome" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="ipt_email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="ipt_senha" placeholder="******">
            </div>
            <button class="btn-submit" onclick="cadastrar()">Cadastrar</button>
            <div id="mensagem_erro"></div>
            <div class="link-alt">
                Já tem conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    function cadastrar() {
    let nome = ipt_nome.value;
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    if (nome.trim() == "" || email.trim() == "" || senha.trim() == "") {
        mensagem_erro.innerHTML = "⚠️ Por favor, preencha todos os campos!";
        return false;
    }

    let arroba = email.indexOf('@'); 
    let ponto_com = email.lastIndexOf('.com');

    if (arroba == -1 || ponto_com == -1 || ponto_com < arroba) {
        mensagem_erro.innerHTML = "⚠️ E-mail inválido! Certifique-se de usar '@' e '.com' na ordem correta.";
        return false;
    }

    if (senha.length < 8) {
    mensagem_erro.innerHTML = "⚠️ A senha deve ter no mínimo 8 caracteres!";
    return false;
}

let tem_maiuscula = false;
let tem_numero = false;
let tem_especial = false;

let caracteresEspeciais = "!@#$%^&*()_+-=[]{}|;':\",./<>?";

for (let i = 0; i < senha.length; i++) {
    let letra_atual = senha[i];

    if (letra_atual >= '0' && letra_atual <= '9') {
        tem_numero = true;
    } 
    else if (letra_atual >= 'A' && letra_atual <= 'Z') {
        tem_maiuscula = true;
    } 
    else if (caracteresEspeciais.indexOf(letra_atual) != -1) {
        tem_especial = true;
    }
}

if (tem_maiuscula == false) {
    mensagem_erro.innerHTML = "⚠️ A senha deve conter pelo menos uma letra maiúscula!";
    return false;
}

if (tem_numero == false) {
    mensagem_erro.innerHTML = "⚠️ A senha deve conter pelo menos um número!";
    return false;
}

if (tem_especial == false) {
    mensagem_erro.innerHTML = "⚠️ A senha deve conter pelo menos um caractere especial! (Ex: @, #, $)";
    return false;

  } else {
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nome,
        emailServer: email,
        senhaServer: senha,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mensagem_erro.innerHTML =
            "✅Cadastro realizado com sucesso!<br>Redirecionando para tela de Login...";

          setTimeout(() => {
          window.location = "./login.html";
            }, 2000);

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
    }
    
  
    }

</script>
